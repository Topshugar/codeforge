<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Owhiz - Build anything with prompt</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e0f13;--panel:#17181e;--border:#25262e;--blue:#5a6bff;--text:#e6e6e6}
body{height:100dvh;width:100vw;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.top b{font-size:16px} .top b span{color:var(--blue)}
.workspace{flex:1;display:flex;overflow:hidden}
.sidebar{width:220px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-title{padding:12px;font-size:11px;letter-spacing:1px;opacity:.6}
.file{padding:8px 12px;font-size:13px;cursor:pointer;border-left:2px solid transparent}
.file.active{background:#1f2029;border-left-color:var(--blue)} .file:hover{background:#1f2029}
.code-area{flex:1.2;display:flex;flex-direction:column;min-width:0}
.code-head{height:38px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:12px;justify-content:space-between}
#editor{flex:1;background:#0e0f13;color:#d4d4d4;border:none;outline:none;padding:16px;font-family:'JetBrains Mono',Consolas,monospace;font-size:13.5px;line-height:1.6;resize:none;white-space:pre;overflow:auto;tab-size:2}
.preview-area{flex:1.3;background:#fff;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--border)}
.prev-head{height:38px;background:#f6f6f7;border-bottom:1px solid #e5e5e5;color:#111;display:flex;align-items:center;padding:0 12px;font-size:12px;gap:8px}
#preview{flex:1;border:none;width:100%;background:white}
.prompt{height:72px;background:var(--panel);border-top:1px solid var(--border);display:flex;gap:10px;padding:10px 12px;align-items:center}
#promptInput{flex:1;height:100%;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:white;padding:12px 14px;outline:none;font-size:14px;resize:none}
#genBtn{background:var(--blue);color:white;border:none;border-radius:10px;padding:0 22px;height:44px;font-weight:600;cursor:pointer;white-space:nowrap}
#genBtn:disabled{opacity:.5}
@media(max-width:900px){.sidebar{display:none}.workspace{flex-direction:column}.preview-area{height:45%}}
</style>
</head>
<body>
<div class="top"><b>Owhiz <span>Builder</span></b><div style="font-size:12px;opacity:.6">v1.0 • Free</div></div>
<div class="workspace">
  <div class="sidebar"><div class="side-title">EXPLORER</div><div id="fileList"></div></div>
  <div class="code-area"><div class="code-head"><span id="currentFileName">No file</span><span style="opacity:.5">Editable • Live</span></div><textarea id="editor" spellcheck="false" placeholder="// Your generated code appears here. You can edit it directly."></textarea></div>
  <div class="preview-area"><div class="prev-head"><div style="width:10px;height:10px;background:#ff5f57;border-radius:50%"></div><div style="width:10px;height:10px;background:#ffbd2e;border-radius:50%"></div><div style="width:10px;height:10px;background:#28ca42;border-radius:50%"></div><span style="margin-left:8px">Preview</span><button onclick="updatePreview()" style="margin-left:auto;border:1px solid #ddd;border-radius:6px;padding:4px 10px;background:white;cursor:pointer">↻ Refresh</button></div><iframe id="preview"></iframe></div>
</div>
<div class="prompt"><textarea id="promptInput" placeholder="Describe what to build... e.g. Build a modern school website with admissions, courses, contact"></textarea><button id="genBtn" onclick="doGenerate()">Generate</button></div>
<script>
let files=[], cur=0;
function doGenerate(){
 const p=document.getElementById('promptInput').value.trim(); if(!p) return;
 const btn=document.getElementById('genBtn'); btn.disabled=true; btn.textContent='Building...';
 fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})})
 .then(r=>r.json()).then(d=>{
   if(d.error && !d.files){alert(d.error); return}
   files=d.files||[]; cur=0; renderFiles(); if(files[0]) openFile(0); updatePreview();
 }).catch(e=>alert(e)).finally(()=>{btn.disabled=false; btn.textContent='Generate'});
}
function renderFiles(){document.getElementById('fileList').innerHTML=files.map((f,i)=>`<div class="file ${i===cur?'active':''}" onclick="openFile(${i})">${f.name}</div>`).join('')}
function openFile(i){cur=i; document.getElementById('currentFileName').textContent=files[i].name; document.getElementById('editor').value=files[i].content; renderFiles()}
function updatePreview(){
 const html=files.find(f=>f.name.endsWith('.html'))?.content||''; const css=files.find(f=>f.name.endsWith('.css'))?.content||''; const js=files.find(f=>f.name.endsWith('.js'))?.content||'';
 if(!html) return;
 let out=html; if(css && !out.includes('<style>')) out=out.replace('</head>',`<style>${css}</style></head>`); if(js) out=out.replace('</body>',`<script>${js}<\/script></body>`);
 document.getElementById('preview').srcdoc=out;
}
document.getElementById('editor').addEventListener('input', e=>{ if(files[cur]){files[cur].content=e.target.value; updatePreview()}});
</script>
</body>
</html>
