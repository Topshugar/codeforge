<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeForge - Free Replit Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;display:flex;flex-direction:column;background:#0e1525;color:white;font-family: 'Segoe UI', monospace;overflow:hidden}
header{height:45px;background:#1c2333;display:flex;align-items:center;padding:0 15px;border-bottom:1px solid #2b3245}
header b{color:#0079ff}
.main{flex:1;display:flex;overflow:hidden}
.files{width:200px;background:#1c2333;border-right:1px solid #2b3245;padding:10px;overflow-y:auto}
.files div{padding:6px;cursor:pointer;border-radius:4px;margin-bottom:2px}
.files div:hover,.files div.active{background:#2b3245}
.editor{flex:1;display:flex;flex-direction:column;background:#0e1525}
#codeEditor{flex:1;background:#0e1525;color:#d4d4d4;padding:15px;border:none;resize:none;outline:none;font-family:'Consolas',monospace;font-size:14px;white-space:pre;overflow:auto}
.preview{width:40%;background:white;border-left:1px solid #2b3245;display:flex;flex-direction:column}
.preview-header{height:35px;background:#f3f3f3;color:#333;display:flex;align-items:center;padding:0 10px;font-size:12px}
#previewFrame{flex:1;border:none;width:100%;background:white}
.prompt-bar{height:90px;background:#1c2333;border-top:1px solid #2b3245;display:flex;padding:10px;gap:10px}
#promptInput{flex:1;background:#0e1525;color:white;border:1px solid #2b3245;border-radius:6px;padding:12px;resize:none;outline:none}
#generateBtn{background:#0079ff;color:white;border:none;border-radius:6px;padding:0 25px;cursor:pointer;font-weight:bold}
#generateBtn:disabled{opacity:0.5}
@media(max-width:768px){.files{display:none}.preview{width:50%}.main{flex-direction:column}.preview{width:100%;height:40%}}
</style>
</head>
<body>
<header><b>⚡ CodeForge</b> &nbsp; - Free Replit Agent - Build anything with prompt</header>

<div class="main">
  <div class="files" id="fileList"><div style="opacity:0.5">No files yet</div></div>
  <div class="editor"><textarea id="codeEditor">// Your code will appear here
// Prompt something like "build a flappy bird game"</textarea></div>
  <div class="preview"><div class="preview-header">🔴 Live Preview</div><iframe id="previewFrame"></iframe></div>
</div>

<div class="prompt-bar">
  <textarea id="promptInput" placeholder="Prompt: Build me a todo app, or a calculator, or a portfolio website..."></textarea>
  <button id="generateBtn" onclick="generate()">Generate ⚡</button>
</div>

<script>
let files = [];
let currentFile = 0;

async function generate(){
  const prompt = document.getElementById('promptInput').value;
  if(!prompt) return;
  const btn = document.getElementById('generateBtn');
  btn.disabled = true; btn.innerText = 'Building...';
  
  try{
    const res = await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const data = await res.json();
    files = data.files || [];
    renderFiles();
    if(files.length>0) openFile(0);
    updatePreview();
  }catch(e){alert(e)}
  btn.disabled = false; btn.innerText = 'Generate ⚡';
}

function renderFiles(){
  const list = document.getElementById('fileList');
  list.innerHTML = files.map((f,i)=>`<div class="${i==currentFile?'active':''}" onclick="openFile(${i})">📄 ${f.name}</div>`).join('');
}
function openFile(i){
  currentFile = i;
  document.getElementById('codeEditor').value = files[i].content;
  renderFiles();
}
function updatePreview(){
  const htmlFile = files.find(f=>f.name.includes('html'));
  if(htmlFile){
    const css = files.find(f=>f.name.includes('css'))?.content || '';
    const js = files.find(f=>f.name.includes('js'))?.content || '';
    const full = htmlFile.content.replace('</head>',`<style>${css}</style></head>`).replace('</body>',`<script>${js}<\/script></body>`);
    document.getElementById('previewFrame').srcdoc = full;
  }
}
document.getElementById('codeEditor').addEventListener('input', (e)=>{
  if(files[currentFile]) files[currentFile].content = e.target.value;
  updatePreview();
});
</script>
</body>
</html>
