<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CodeForge - Replit Agent Clone</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@500;600&display=swap');*{font-family:Inter} .mono{font-family:JetBrains Mono}</style>
</head>
<body class="bg-[#0e0e10] text-white h-screen flex flex-col">
<div class="h-12 border-b border-[#232326] flex items-center justify-between px-4">
<div class="flex items-center gap-2"><div class="w-6 h-6 bg-[#ff4400] rounded flex items-center justify-center font-bold">R</div><span class="font-semibold text-sm">CodeForge</span><span class="text-[10px] bg-[#1c1c1f] border border-[#2a2a2e] px-2 py-1 rounded-full text-zinc-400">BUILDS ANYTHING</span></div>
<div class="text-[11px] mono text-zinc-500">Replit Agent Clone</div>
</div>

<div class="flex-1 flex overflow-hidden">
<div class="w-[360px] bg-[#121214] border-r border-[#232326] flex flex-col">
<div class="p-4 flex-1 overflow-auto" id="chat">
<div class="bg-[#1a1a1e] border border-[#27272a] p-3 rounded-xl text-[13px]"><b>👋 I can build ANYTHING</b><br><span class="text-zinc-400 text-[12px]">Type like you type to me. Examples:<br>• trading calculator with fees & leverage<br>• Instagram clone<br>• Crypto dashboard<br>• Todo app with auth</span></div>
</div>
<div class="p-3 border-t border-[#232326]">
<textarea id="p" class="w-full bg-[#1a1a1e] border border-[#2a2a2e] rounded-xl p-3 text-[13px] h-20 outline-none focus:border-[#ff4400]" placeholder="Ask to build anything..."></textarea>
<button id="b" class="w-full mt-2 bg-white text-black py-2.5 rounded-xl font-semibold text-[13px]">▲ Build Anything</button>
<div id="log" class="mt-2 mono text-[10px] text-zinc-500 h-16 overflow-auto bg-black rounded p-2 border border-[#1e1e20]"></div>
</div>
</div>

<div class="flex-1 bg-[#09090b] flex flex-col">
<div class="h-9 bg-[#121214] border-b border-[#232326] flex items-center px-3 gap-2 mono text-[11px] text-zinc-500"><span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span><span id="status">Ready - type what to build</span></div>
<iframe id="prev" class="flex-1 w-full bg-white"></iframe>
</div>
</div>

<script>
const $ = id=>document.getElementById(id);
function addMsg(t, me=false){
 const d=document.createElement('div'); d.className=me?'mt-3 ml-8 bg-white text-black p-3 rounded-xl text-[13px]':'mt-3 bg-[#1a1a1e] border border-[#27272a] p-3 rounded-xl text-[13px]';
 d.innerHTML=t; $('chat').appendChild(d); $('chat').scrollTop=9999;
}
$('b').onclick=async()=>{
 const pr=$('p').value.trim(); if(!pr)return;
 addMsg(pr,true); $('p').value=''; $('b').innerText='Building...';
 $('log').innerHTML=''; $('log').innerHTML+=`> Building: ${pr}<br>`; $('status').innerText='Agent building...';
 const fd=new FormData(); fd.append('prompt',pr);
 try{
  const r=await fetch('/generate',{method:'POST',body:fd}); const d=await r.json();
  if(d.error) throw new Error(d.error);
  $('log').innerHTML+=`> Plan: ${d.plan}<br>> Files: ${d.files.length}<br>`;
  const html=d.files[0].content; $('prev').srcdoc=html;
  $('log').innerHTML+=`> ✅ Preview ready<br>`;
  $('status').innerText=d.plan; addMsg(`✅ <b>Built!</b> ${d.plan}<br><br>Preview is live on right. Want edit? Just type: "make it dark mode" or "add chart"`);
 }catch(e){
  $('log').innerHTML+=`> ❌ ${e.message}<br>`; addMsg(`❌ ${e.message}`); $('status').innerText='Error';
 }
 $('b').innerText='▲ Build Anything';
}
</script>
</body>
</html>
