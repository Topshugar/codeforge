<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owhiz — Agent Builder</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0e0f13;--panel:#17181e;--border:#25262e;--blue:#5a6bff;--text:#e8e8e8}
body{height:100dvh;width:100vw;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{height:50px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px}
.top b{font-size:16px} .top b span{color:var(--blue)}
.main{flex:1;display:flex;overflow:hidden}
.chat{width:360px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.chat-log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;max-width:92%}
.msg.user{background:var(--blue);align-self:flex-end;color:white}
.msg.agent{background:#1f2029;border:1px solid var(--border);align-self:flex-start}
.chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--border)}
#userInput{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:white;padding:12px;outline:none;font-size:14px}
#sendBtn{background:var(--blue);border:none;color:white;border-radius:10px;padding:0 18px;font-weight:600;cursor:pointer}
.workspace{flex:1;display:flex;overflow:hidden}
.code-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.code-head{height:38px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:12px;justify-content:space-between}
#editor{flex:1;background:#0e0f13;color:#d4d4d4;border:none;outline:none;padding:16px;font-family:monospace;font-size:13px;line-height:1.6;resize:none;white-space:pre;overflow:auto}
.preview-area{flex:1.1;background:#fff;display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--border)}
.prev-head{height:38px;background:#f5f5f5;border-bottom:1px solid #ddd;color:#111;display:flex;align-items:center;padding:0 12px;font-size:12px}
#preview{flex:1;border:none;width:100%}
#fileList{display:flex;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--border);overflow:auto}
.file{padding:4px 10px;background:#1f2029;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid var(--border)}
.file.active{background:var(--blue);border-color:var(--blue);color:white}
@media(max-width:900px){.chat{width:100%;height:40%}.main{flex-direction:column}.workspace{height:60%}}
</style>
</head>
<body>
<div class="top"><b>Owhiz <span>Agent</span></b><span style="font-size:12px;opacity:.6;margin-left:auto">Builds sophisticated apps via dialogue</span></div>
<div class="main">
  <div class="chat">
    <div id="chatLog" class="chat-log">
      <div class="msg agent">Hi! I'm Owhiz Agent. Tell me what you want to build, and I'll guide you, recommend features, and build a sophisticated version.<br><br>Try: "Build a school website"</div>
    </div>
    <div class="chat-input">
      <input id="userInput" placeholder="Describe what to build..." onkeydown="if(event.key==='Enter')sendChat()">
      <button id="sendBtn" onclick="sendChat()">Send</button>
    </div>
  </div>
  <div class="workspace">
    <div class="code-area">
      <div id="fileList"></div>
      <div class="code-head"><span id="curFile">No file</span><button onclick="updatePreview()" style="background:none;border:1px solid #333;color:#aaa;padding:2px 8px;border-radius:6px;cursor:pointer">Refresh Preview</button></div>
      <textarea id="editor" spellcheck="false"></textarea>
    </div>
    <div class="preview-area">
      <div class="prev-head">Preview • Live</div>
      <iframe id="preview"></iframe>
    </div>
  </div>
</div>
<script>
let files=[], cur=0, history=[];
function addMsg(text, who){
  const div=document.createElement('div'); div.className='msg '+who; div.innerHTML=text.replace(/\n/g,'<br>'); document.getElementById('chatLog').appendChild(div);
  document.getElementById('chatLog').scrollTop=document.getElementById('chatLog').scrollHeight;
}
async function sendChat(){
  const input=document.getElementById('userInput'); const text=input.value.trim(); if(!text) return;
  addMsg(text,'user'); input.value=''; history.push({role:'user',content:text});
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});
    const d=await r.json(); const reply=d.reply;
    addMsg(reply,'agent'); history.push({role:'assistant',content:reply});
    if(reply.includes('[READY_TO_BUILD]')){
      let prompt=reply.split('[READY_TO_BUILD]')[1] || text;
      generateCode(prompt);
    }
  }catch(e){addMsg('Error: '+e,'agent')}
}
async function generateCode(prompt){
  addMsg('⚡ Building: '+prompt.substring(0,80)+'...','agent');
  try{
    const r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});
    const d=await r.json(); files=d.files||[]; if(files.length){ cur=0; renderFiles(); openFile(0); updatePreview(); addMsg('✅ Built! Code is editable and preview is live. Say "add login" to iterate.','agent')}
  }catch(e){addMsg('Build error: '+e,'agent')}
}
function renderFiles(){document.getElementById('fileList').innerHTML=files.map((f,i)=>`<div class="file ${i===cur?'active':''}" onclick="openFile(${i})">${f.name}</div>`).join('')}
function openFile(i){cur=i; document.getElementById('curFile').textContent=files[i].name; document.getElementById('editor').value=files[i].content; renderFiles()}
function updatePreview(){
  const html=files.find(f=>f.name.endsWith('.html'))?.content||''; const css=files.find(f=>f.name.endsWith('.css'))?.content||''; const js=files.find(f=>f.name.endsWith('.js'))?.content||'';
  if(!html) return; let out=html; if(css) out=out.replace('</head>',`<style>${css}</style></head>`); if(js) out=out.replace('</body>',`<script>${js}<\/script></body>`);
  document.getElementById('preview').srcdoc=out;
}
document.getElementById('editor').addEventListener('input', e=>{ if(files[cur]){files[cur].content=e.target.value; updatePreview()}});
</script>
</body>
</html>
