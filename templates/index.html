<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owhiz - Build Anything</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0a0e14;color:#e6e8eb;height:100vh;display:flex;overflow:hidden}
.left{width:360px;background:#0f141e;border-right:1px solid #1e293b;display:flex;flex-direction:column;flex-shrink:0}
.logo{height:56px;padding:0 18px;display:flex;align-items:center;font-size:20px;font-weight:700;border-bottom:1px solid #1e293b}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#64748b;padding:20px}
.empty h2{color:white;font-size:18px;margin-bottom:8px}
.empty p{font-size:13px;line-height:1.5}
.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.sug{border:1px solid #233148;background:#1a2233;padding:6px 12px;border-radius:20px;font-size:12px;cursor:pointer;color:#94a3b8}
.msg{padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.5}
.msg.user{background:#1e2a44;align-self:flex-end;max-width:90%;border-bottom-right-radius:4px}
.msg.ai{background:#1a2233;border:1px solid #233148}
.input-wrap{padding:14px;border-top:1px solid #1e293b;display:flex;gap:8px}
.input-wrap input{flex:1;background:#0a0e14;border:1px solid #233148;border-radius:12px;padding:12px 14px;color:white;outline:none;font-size:13px}
.input-wrap button{width:44px;height:44px;background:#1dbf73;border:none;border-radius:12px;cursor:pointer;font-weight:700;color:white}
.right{flex:1;background:#f8fafc;display:flex;flex-direction:column}
.right-head{height:56px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#0f172a;font-size:13px;font-weight:600}
.preview{flex:1;background:white;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.preview-empty{color:#94a3b8;text-align:center;padding:40px}
.preview-empty h3{color:#0f172a;margin-bottom:6px}
iframe{width:100%;height:100%;border:none;background:white}
@media(max-width:850px){
body{flex-direction:column}
.left{width:100%;height:55%;order:2}
.right{height:45%;order:1}
}
</style>
</head>
<body>
<div class="left">
<div class="logo">✨ Owhiz</div>
<div class="chat" id="chat">
<div class="empty" id="empty">
<h2>What do you want to build?</h2>
<p>Describe your app, website, or tool. Owhiz builds it instantly.</p>
<div class="suggestions">
<span class="sug" onclick="quick('Build a school website')">School website</span>
<span class="sug" onclick="quick('Build a food delivery app')">Food delivery</span>
<span class="sug" onclick="quick('Build an AI chatbot dashboard')">AI dashboard</span>
</div>
</div>
</div>
<div class="input-wrap">
<input id="prompt" placeholder="Ask Owhiz to build something..." onkeydown="if(event.key==='Enter')build()">
<button onclick="build()">➤</button>
</div>
</div>

<div class="right">
<div class="right-head">
<span>● Preview</span>
<span style="color:#64748b;font-weight:400">outcome</span>
</div>
<div class="preview" id="preview">
<div class="preview-empty">
<h3>Your app will appear here</h3>
<p>Start chatting on the left</p>
</div>
</div>
</div>

<script>
function quick(t){document.getElementById('prompt').value=t;build();}
async function build(){
let input=document.getElementById('prompt');
let prompt=input.value.trim();
if(!prompt)return;
let chat=document.getElementById('chat');
document.getElementById('empty')?.remove();
let u=document.createElement('div');u.className='msg user';u.textContent=prompt;chat.appendChild(u);
input.value='';
let a=document.createElement('div');a.className='msg ai';a.textContent='Building...';chat.appendChild(a);
chat.scrollTop=chat.scrollHeight;
let preview=document.getElementById('preview');
preview.innerHTML='<div class="preview-empty">Building your app...</div>';
try{
let form=new FormData();form.append('prompt',prompt);
let res=await fetch('/generate',{method:'POST',body:form});
let data=await res.json();
a.textContent=data.message || 'Done! Your app is ready.';
let iframe=document.createElement('iframe');
preview.innerHTML='';
preview.appendChild(iframe);
iframe.srcdoc=data.code;
}catch(e){
a.textContent='Error building. Try again.';
preview.innerHTML='<div class="preview-empty">Failed to build</div>';
}
}
</script>
</body>
</html>
