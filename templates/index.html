<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owhiz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#0a0e14;color:#e6e8eb;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{height:56px;background:#0f141e;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0}
.top-left{display:flex;align-items:center;gap:16px}
.logo{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.file-tab{background:#1a2233;padding:6px 12px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:6px;border:1px solid #233148}
.top-right{display:flex;align-items:center;gap:10px}
.btn-run{background:#1dbf73;color:white;border:none;padding:8px 20px;border-radius:10px;font-weight:600;font-size:14px;cursor:pointer}
.icon-btn{width:36px;height:36px;background:#1a2233;border:1px solid #233148;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9ca3af}
.main{flex:1;display:flex;overflow:hidden}
.panel{flex:1;display:flex;flex-direction:column;background:#0f141e;border-right:1px solid #1e293b;overflow:hidden}
.panel:last-child{border-right:none}
.panel-head{height:44px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;font-size:13px;font-weight:600;flex-shrink:0}
.chat-area{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#64748b;padding:40px}
.empty h2{color:white;margin-bottom:8px;font-size:18px}
.msg{background:#1a2233;padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.5;border:1px solid #233148}
.msg.user{background:#1e2a44;align-self:flex-end;max-width:85%}
.chat-input-area{padding:12px;border-top:1px solid #1e293b;display:flex;gap:8px;align-items:center}
.chat-input{flex:1;background:#0a0e14;border:1px solid #233148;border-radius:12px;padding:11px 14px;color:white;font-size:13px;outline:none}
.send{width:40px;height:40px;background:#2dd4bf;border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.code-area{flex:1;background:#0b101a;overflow:auto;padding:24px;display:flex;align-items:center;justify-content:center;color:#475569;font-family:JetBrains Mono,monospace;font-size:13px}
.preview-wrap{flex:1;background:#f8fafc;display:flex;align-items:center;justify-content:center;color:#94a3b8}
.live-dot{width:8px;height:8px;background:#475569;border-radius:50%;display:inline-block;margin-right:6px}
.mobile-tabs{display:none;height:48px;background:#0f141e;border-top:1px solid #1e293b}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:white;border-bottom-color:#1dbf73;background:#151e2f}
@media(max-width:900px){.main{flex-direction:column}.panel{display:none}.panel.active{display:flex}.mobile-tabs{display:flex}}
</style>
</head>
<body>
<div class="top">
<div class="top-left"><div class="logo">✨ Owhiz</div><div class="file-tab">📁 index.html</div></div>
<div class="top-right"><button class="btn-run">▶ Run</button></div>
</div>

<div class="main">
<div class="panel active" id="p-ai">
<div class="panel-head"><span>✨ Owhiz AI</span></div>
<div class="chat-area" id="chat">
<div class="empty">
<h2>What do you want to build?</h2>
<p>Ask Owhiz to create a website, app, or landing page. Your code and preview will appear here.</p>
</div>
</div>
<div class="chat-input-area">
<input id="chatIn" class="chat-input" placeholder="Ask Owhiz to build something...">
<button class="send" onclick="sendMsg()">➤</button>
</div>
</div>

<div class="panel" id="p-code">
<div class="panel-head"><span>index.html</span></div>
<div class="code-area">// Your code will appear here</div>
</div>

<div class="panel" id="p-preview">
<div class="panel-head"><span><span class="live-dot"></span>Preview</span></div>
<div class="preview-wrap">No preview yet — build something first</div>
</div>
</div>

<div class="mobile-tabs">
<div class="tab active" onclick="switchTab('ai')">AI</div>
<div class="tab" onclick="switchTab('code')">Code</div>
<div class="tab" onclick="switchTab('preview')">Preview</div>
</div>

<script>
function switchTab(t){
document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
document.getElementById('p-'+t).classList.add('active');
document.querySelector(`.tab[onclick="switchTab('${t}')"]`).classList.add('active');
}
function sendMsg(){
let i=document.getElementById('chatIn');
if(!i.value.trim())return;
let c=document.getElementById('chat');
c.innerHTML='';
let d=document.createElement('div');
d.className='msg user';
d.textContent=i.value;
c.appendChild(d);
i.value='';
}
</script>
</body>
</html>
