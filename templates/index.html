<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Owhiz Agent</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100dvh;width:100vw;background:#0e0f13;color:#e8e8e8;font-family:system-ui;display:flex;flex-direction:column;overflow:hidden}
.top{height:48px;min-height:48px;background:#17181e;border-bottom:1px solid #25262e;display:flex;align-items:center;padding:0 14px;z-index:10}
.top b span{color:#5a6bff}
.main{flex:1;display:flex;overflow:hidden;position:relative}
.chat{width:360px;min-width:300px;background:#17181e;border-right:1px solid #25262e;display:flex;flex-direction:column}
#chatLog{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{padding:10px 12px;border-radius:12px;font-size:13px;line-height:1.5;max-width:90%;word-break:break-word}
.user{background:#5a6bff;align-self:flex-end;color:#fff}
.agent{background:#1f2029;border:1px solid #25262e;align-self:flex-start}
.chat-input{height:60px;min-height:60px;display:flex;gap:8px;padding:8px;border-top:1px solid #25262e;background:#17181e}
#userInput{flex:1;background:#0e0f13;border:1px solid #25262e;border-radius:10px;color:#fff;padding:10px 12px;outline:none}
#sendBtn{background:#5a6bff;border:none;color:#fff;border-radius:10px;padding:0 16px;font-weight:700;cursor:pointer}
.workspace{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0e0f13}
.code-top{height:36px;background:#17181e;border-bottom:1px solid #25262e;display:flex;align-items:center;padding:0 10px;justify-content:space-between;font-size:12px}
#editor{flex:1;background:#0e0f13;color:#d4d4d4;border:none;outline:none;padding:12px;font-family:monospace;font-size:13px;resize:none}
#preview{flex:1;border:none;width:100%;background:#fff}
#fileList{display:flex;gap:6px;padding:6px;background:#17181e;border-bottom:1px solid #25262e;overflow:auto}
.file{padding:3px 8px;background:#1f2029;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid #25262e;white-space:nowrap}
.file.active{background:#5a6bff;color:#fff}
@media(max-width:800px){
.main{flex-direction:column}
.chat{width:100%;height:50%;min-height:50%}
.workspace{height:50%}
}
</style></head>
<body>
<div class="top"><b>Owhiz <span>Agent</span></b><span style="font-size:11px;opacity:.5;margin-left:8px">Builds via dialogue</span></div>
<div class="main">
<div class="chat">
<div id="chatLog"><div class="msg agent">Hi! I'm Owhiz Agent. Tell me what to build — I'll ask clarifying questions, suggest features, then build a sophisticated version.<br><br>Try: "Build a school website"</div></div>
<div class="chat-input"><input id="userInput" placeholder="Describe..." onkeydown="if(event.key==='Enter')sendChat()"><button id="sendBtn" onclick="sendChat()">Send</button></div>
</div>
<div class="workspace">
<div id="fileList"></div>
<div class="code-top"><span id="curFile">No file</span><button onclick="updatePreview()" style="background:none;border:1px solid #333;color:#aaa;padding:2px 6px;border-radius:4px;font-size:11px">Refresh</button></div>
<textarea id="editor"></textarea>
<iframe id="preview"></iframe>
</div>
</div>
<script>
let files=[],cur=0,history=[];
function addMsg(t,w){let d=document.createElement('div');d.className='msg '+w;d.innerHTML=t.replace(/\n/g,'<br>');document.getElementById('chatLog').appendChild(d);document.getElementById('chatLog').scrollTop=99999}
async function sendChat(){
 let input=document.getElementById('userInput');let text=input.value.trim();if(!text)return;
 addMsg(text,'user');input.value='';history.push({role:'user',content:text});
 let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});
 let d=await r.json(); addMsg(d.reply,'agent');history.push({role:'assistant',content:d.reply});
 if(d.reply.includes('[READY_TO_BUILD]')){generateCode(d.reply.split('[READY_TO_BUILD]')[1]||text)}
}
async function generateCode(p){
 addMsg('⚡ Building...','agent');
 let r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
 let d=await r.json(); if(d.error){addMsg('Error: '+d.error,'agent');return}
 files=d.files||[]; if(files.length){cur=0;render();open(0);updatePreview();addMsg('✅ Built! Editable. Say "add dark mode" to iterate.','agent')}
}
function render(){document.getElementById('fileList').innerHTML=files.map((f,i)=>`<div class="file ${i===cur?'active':''}" onclick="openFile(${i})">${f.name}</div>`).join('')}
function openFile(i){cur=i;document.getElementById('curFile').textContent=files[i].name;document.getElementById('editor').value=files[i].content;render()}
function updatePreview(){
 let h=files.find(f=>f.name.includes('html'))?.content||''; if(!h)return;
 let c=files.find(f=>f.name.endsWith('css'))?.content||''; let j=files.find(f=>f.name.endsWith('js'))?.content||'';
 let out=h; if(c)out=out.replace('</head>',`<style>${c}</style></head>`); if(j)out=out.replace('</body>',`<script>${j}<\/script></body>`);
 document.getElementById('preview').srcdoc=out;
}
window.openFile=openFile;
document.getElementById('editor').addEventListener('input',e=>{if(files[cur]){files[cur].content=e.target.value;updatePreview()}})
</script>
</body></html>
