<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Owhiz Agent - Replit Style</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100dvh;background:#0e1525;color:#c2c8cc;font-family:Inter,system-ui;display:flex;flex-direction:column;overflow:hidden}
.top{height:44px;background:#0e1525;border-bottom:1px solid #2b3245;display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0}
.top b{color:#fff} .top b span{color:#4e6cf6}
.tabs-mobile{display:none;height:44px;background:#1c2333;border-top:1px solid #2b3245}
.tab{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#8a919e;cursor:pointer;border-top:2px solid transparent}
.tab.active{color:#fff;border-top-color:#4e6cf6;background:#0e1525}
.main{flex:1;display:flex;overflow:hidden}
.panel-chat{width:360px;min-width:300px;background:#0e1525;border-right:1px solid #2b3245;display:flex;flex-direction:column}
.panel-code{flex:1;display:flex;flex-direction:column;background:#0e1525;min-width:300px;border-right:1px solid #2b3245}
.panel-preview{flex:1;display:flex;flex-direction:column;background:#fff;min-width:300px}
.p-head{height:36px;background:#1c2333;border-bottom:1px solid #2b3245;display:flex;align-items:center;padding:0 10px;font-size:12px;font-weight:600;color:#fff;justify-content:space-between;flex-shrink:0}
#chatLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.5;max-width:92%;white-space:pre-wrap;word-break:break-word}
.user{background:#4e6cf6;color:#fff;align-self:flex-end}
.agent{background:#1c2333;border:1px solid #2b3245;align-self:flex-start;color:#c2c8cc}
.chat-input{height:52px;display:flex;gap:6px;padding:6px;background:#1c2333;border-top:1px solid #2b3245;flex-shrink:0}
#userInput{flex:1;background:#0e1525;border:1px solid #2b3245;border-radius:8px;color:#fff;padding:8px 12px;outline:none}
#sendBtn{background:#4e6cf6;border:none;color:#fff;border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer}
#fileList{display:flex;gap:4px;padding:6px;background:#1c2333;border-bottom:1px solid #2b3245;overflow:auto;flex-shrink:0}
.file{padding:4px 10px;background:#0e1525;border:1px solid #2b3245;border-radius:6px;font-size:11px;cursor:pointer;color:#8a919e;white-space:nowrap}
.file.active{background:#4e6cf6;color:#fff;border-color:#4e6cf6}
#editor{flex:1;background:#0e1525;color:#d4d4d4;border:none;outline:none;padding:12px;font-family:Consolas,monospace;font-size:13px;resize:none;line-height:1.6}
#preview{flex:1;border:none;width:100%;background:#fff}
@media(max-width:900px){
.main{flex-direction:column}
.panel-chat,.panel-code,.panel-preview{width:100%;height:100%;display:none}
.panel-chat.active,.panel-code.active,.panel-preview.active{display:flex}
.tabs-mobile{display:flex}
}
</style></head>
<body>
<div class="top"><b>Owhiz <span>Agent</span></b><span style="font-size:11px;color:#8a919e">Replit Layout</span></div>
<div class="main">
<div class="panel-chat active" id="pChat">
<div class="p-head">💬 AI Builder</div>
<div id="chatLog"><div class="msg agent">Hi! I'm Owhiz. Tell me what to build.

I'll ask questions, then build.

Try: "Build a school website with admissions page"</div></div>
<div class="chat-input"><input id="userInput" placeholder="What to build?" onkeydown="if(event.key==='Enter')sendChat()"><button id="sendBtn" onclick="sendChat()">Send</button></div>
</div>
<div class="panel-code" id="pCode">
<div class="p-head"><span id="curFile">No file</span><button onclick="doPreview()" style="background:#2b3245;border:none;color:#fff;padding:3px 8px;border-radius:4px;font-size:11px">Run ▶</button></div>
<div id="fileList"></div>
<textarea id="editor" placeholder="// Code will appear here... Edit and click Run"></textarea>
</div>
<div class="panel-preview" id="pPreview">
<div class="p-head" style="background:#f5f5f5;color:#111;border-bottom:1px solid #ddd">🔍 Preview <span style="font-weight:400;color:#666">Live</span></div>
<iframe id="preview"></iframe>
</div>
</div>
<div class="tabs-mobile">
<div class="tab active" onclick="showTab('chat')">Chat</div>
<div class="tab" onclick="showTab('code')">Code</div>
<div class="tab" onclick="showTab('preview')">Preview</div>
</div>
<script>
let files=[],cur=0,history=[];
function showTab(t){
document.querySelectorAll('.panel-chat,.panel-code,.panel-preview').forEach(p=>p.classList.remove('active'));
document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
if(t==='chat'){document.getElementById('pChat').classList.add('active');document.querySelectorAll('.tab')[0].classList.add('active')}
if(t==='code'){document.getElementById('pCode').classList.add('active');document.querySelectorAll('.tab')[1].classList.add('active')}
if(t==='preview'){document.getElementById('pPreview').classList.add('active');document.querySelectorAll('.tab')[2].classList.add('active')}
}
function addMsg(t,w){let d=document.createElement('div');d.className='msg '+w;d.textContent=t;document.getElementById('chatLog').appendChild(d);document.getElementById('chatLog').scrollTop=99999}
async function sendChat(){
 let input=document.getElementById('userInput');let text=input.value.trim();if(!text)return;
 addMsg(text,'user');input.value='';history.push({role:'user',content:text});
 let r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});
 let d=await r.json(); addMsg(d.reply,'agent');history.push({role:'assistant',content:d.reply});
 if(d.reply.includes('[READY_TO_BUILD]')){generateCode(d.reply.split('[READY_TO_BUILD]')[1]||text)}
}
async function generateCode(p){
 addMsg('⚡ Building... switching to Code tab','agent');
 if(window.innerWidth<=900) showTab('code');
 let r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})});
 let d=await r.json(); if(d.error){addMsg('Error: '+d.error,'agent');return}
 files=d.files||[]; cur=0; renderList(); openFile(0); doPreview();
 addMsg('✅ Built! Check Preview tab.','agent');
 if(window.innerWidth<=900) setTimeout(()=>showTab('preview'),800);
}
function renderList(){document.getElementById('fileList').innerHTML=files.map((f,i)=>`<div class="file ${i===cur?'active':''}" onclick="openFile(${i})">${f.name}</div>`).join('')}
function openFile(i){cur=i;document.getElementById('curFile').textContent=files[i].name;document.getElementById('editor').value=files[i].content;renderList()}
function doPreview(){if(!files.length)return; let htmlFile=files.find(f=>f.name.includes('html'))||files[0]; document.getElementById('preview').srcdoc=htmlFile.content}
document.getElementById('editor').addEventListener('input',e=>{if(files[cur]){files[cur].content=e.target.value; doPreview()}})
</script>
</body></html>
